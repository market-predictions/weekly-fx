name: Validate Weekly FX release assurance

on:
  pull_request:
    paths:
      - "control/FX_RELEASE_ASSURANCE_CONTRACT_V1.md"
      - "control/FX_PRODUCTION_PROMOTION_ASSURANCE_CONTRACT_V1.md"
      - "control/PROJECT_GOVERNANCE_BOOTSTRAP.md"
      - "tools/fx_release_assurance.py"
      - "tests/test_fx_release_assurance.py"
      - "send_fxreport.py"
      - "send_fxreport_legacy.py"
      - ".github/workflows/send-weekly-report.yml"
      - ".github/workflows/validate-fx-release-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile assurance implementation
        run: |
          python -m py_compile tools/fx_release_assurance.py send_fxreport.py send_fxreport_legacy.py

      - name: Run valid and planted-defect contract tests
        run: python -m unittest tests.test_fx_release_assurance -v
