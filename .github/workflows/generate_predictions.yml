name: Generate predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "5 6 * * *"
    - cron: "30 12 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run generator
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python prediction.py

      - name: Show latest outputs
        run: |
          echo "daily_outputs/latest:"
          ls -lah daily_outputs/latest || true

      - name: Upload latest prediction files
        uses: actions/upload-artifact@v4
        with:
          name: today-predictions-files
          path: daily_outputs/latest/
          if-no-files-found: error

      - name: Commit latest outputs to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_outputs/latest/
          if git diff --cached --quiet; then
            echo "No prediction output changes to commit."
            exit 0
          fi
          git commit -m "Update latest prediction files"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3: rebasing onto latest origin/main first."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Prediction output commit conflicts with current main; refusing to overwrite concurrent work."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Unable to publish generated outputs after 3 race-safe attempts."
          exit 1
